<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AISOC — Investigation Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --base: #0d1117; --raised: #161b22; --raised-2: #1c2330;
    --line: #2b3240; --text: #e6edf3; --muted: #7d8590; --faint: #4b525e;
    --accent: #4a9eff; --accent-dim: #1f3a5f;
    --tp: #f85149; --tp-bg: #2d1517; --benign: #3fb950; --benign-bg: #14261a;
    --fp: #7d8590; --fp-bg: #1a1f27; --investigate: #d29922; --investigate-bg: #2b2410;
    --insufficient: #a371f7; --insufficient-bg: #211a2e;
    --api: "http://127.0.0.1:8080";
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: Inter, system-ui, sans-serif;
    background: var(--base); color: var(--text);
    line-height: 1.5; -webkit-font-smoothing: antialiased;
    height: 100vh; display: flex; flex-direction: column;
  }
  /* ---- top bar ---- */
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 22px; border-bottom: 1px solid var(--line);
    background: var(--raised); flex-shrink: 0;
  }
  .brand { display: flex; align-items: baseline; gap: 10px; }
  .brand .mark { font-weight: 700; font-size: 16px; letter-spacing: -0.01em; }
  .brand .sub { color: var(--muted); font-size: 12.5px; }
  .who { display: flex; align-items: center; gap: 12px; font-size: 13px; }
  .who .name { color: var(--text); font-weight: 500; }
  .who .role {
    color: var(--accent); background: var(--accent-dim);
    padding: 2px 8px; border-radius: 4px; font-size: 11.5px; font-weight: 500;
  }
  .who .cloud { color: var(--muted); font-size: 12px; }
  .signout { color: var(--muted); background: none; border: none; cursor: pointer;
    font-size: 12.5px; font-family: inherit; }
  .signout:hover { color: var(--text); }

  /* ---- main ---- */
  main { flex: 1; overflow-y: auto; }
  .wrap { max-width: 820px; margin: 0 auto; padding: 32px 22px 140px; }

  /* ---- login ---- */
  .login-shell { display: flex; align-items: center; justify-content: center; height: 100%; }
  .login {
    width: 360px; background: var(--raised); border: 1px solid var(--line);
    border-radius: 10px; padding: 30px;
  }
  .login h1 { font-size: 18px; font-weight: 600; margin-bottom: 6px; }
  .login p { color: var(--muted); font-size: 13.5px; margin-bottom: 20px; }
  .login label { display: block; font-size: 12.5px; color: var(--muted); margin-bottom: 6px; }
  input[type=password], input[type=text] {
    width: 100%; background: var(--base); border: 1px solid var(--line);
    color: var(--text); border-radius: 7px; padding: 10px 12px; font-size: 14px;
    font-family: inherit; outline: none;
  }
  input:focus { border-color: var(--accent); }
  button.primary {
    width: 100%; margin-top: 16px; background: var(--accent); color: #06122a;
    border: none; border-radius: 7px; padding: 11px; font-size: 14px; font-weight: 600;
    cursor: pointer; font-family: inherit;
  }
  button.primary:hover { filter: brightness(1.08); }
  button.primary:disabled { opacity: 0.5; cursor: default; }
  .login .err { color: var(--tp); font-size: 12.5px; margin-top: 12px; min-height: 16px; }
  .login .note { color: var(--faint); font-size: 11.5px; margin-top: 18px; line-height: 1.5; }

  /* ---- intro / empty state ---- */
  .intro { padding: 8px 0 4px; }
  .intro h2 { font-size: 22px; font-weight: 600; letter-spacing: -0.02em; margin-bottom: 8px; }
  .intro p { color: var(--muted); font-size: 14px; max-width: 60ch; }
  .examples { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 20px; }
  .chip {
    background: var(--raised); border: 1px solid var(--line); color: var(--text);
    border-radius: 20px; padding: 7px 14px; font-size: 12.5px; cursor: pointer;
    font-family: inherit;
  }
  .chip:hover { border-color: var(--accent); color: var(--accent); }

  /* ---- conversation ---- */
  .turn { margin-top: 26px; }
  .ask {
    color: var(--text); font-size: 15px; font-weight: 500;
    padding-left: 14px; border-left: 2px solid var(--accent); margin-bottom: 16px;
  }
  .status {
    display: flex; align-items: center; gap: 9px; color: var(--muted);
    font-size: 13px; padding: 4px 0;
  }
  .dot {
    width: 7px; height: 7px; border-radius: 50%; background: var(--accent);
    animation: pulse 1.1s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 0.3; } 50% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .dot { animation: none; opacity: 0.8; } }

  /* ---- verdict card ---- */
  .verdict { border: 1px solid var(--line); border-radius: 10px; overflow: hidden;
    background: var(--raised); }
  .verdict-head { padding: 20px 22px; border-left: 4px solid var(--muted); }
  .verdict-head.tp { border-color: var(--tp); background: var(--tp-bg); }
  .verdict-head.benign { border-color: var(--benign); background: var(--benign-bg); }
  .verdict-head.fp { border-color: var(--fp); background: var(--fp-bg); }
  .verdict-head.investigate { border-color: var(--investigate); background: var(--investigate-bg); }
  .verdict-head.insufficient { border-color: var(--insufficient); background: var(--insufficient-bg); }
  .verdict-label { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; }
  .verdict-meta { display: flex; gap: 18px; margin-top: 8px; font-size: 12.5px; color: var(--muted); }
  .verdict-meta b { color: var(--text); font-weight: 600; }
  .action-pill { font-weight: 600; }
  .action-pill.escalate, .action-pill.investigate { color: var(--investigate); }
  .action-pill.close { color: var(--benign); }

  .reasoning { padding: 18px 22px; font-size: 14.5px; line-height: 1.65; border-top: 1px solid var(--line); }

  .block { padding: 16px 22px; border-top: 1px solid var(--line); }
  .block h4 { font-size: 12px; color: var(--muted); font-weight: 600; margin-bottom: 10px; }
  .evi { margin-bottom: 12px; }
  .evi:last-child { margin-bottom: 0; }
  .evi .claim { font-size: 14px; }
  .evi .cite { font-size: 12px; color: var(--muted); margin-top: 3px; font-family: ui-monospace, monospace; }
  .evi .cite .ok { color: var(--benign); }
  .evi .cite .no { color: var(--tp); }
  .factors { list-style: none; }
  .factors li { font-size: 13.5px; padding: 3px 0 3px 16px; position: relative; }
  .factors li::before { content: "›"; position: absolute; left: 0; color: var(--accent); }
  .missing li { color: var(--muted); }

  .injection { padding: 14px 22px; border-top: 1px solid var(--line);
    background: var(--tp-bg); }
  .injection h4 { color: var(--tp); }
  .injection .item { font-size: 12.5px; color: var(--text); font-family: ui-monospace, monospace;
    margin-top: 6px; }

  .footer-meta { padding: 12px 22px; border-top: 1px solid var(--line);
    display: flex; gap: 18px; flex-wrap: wrap; font-size: 12px; color: var(--faint); }
  .footer-meta b { color: var(--muted); font-weight: 500; }
  .grounded b { color: var(--benign); }
  .flagged b { color: var(--tp); }

  .routing { font-size: 12.5px; color: var(--muted); margin-bottom: 12px;
    display: flex; align-items: center; gap: 8px; }
  .routing .agent { color: var(--accent); font-weight: 600; }

  .errbox { border: 1px solid var(--tp); background: var(--tp-bg); color: var(--text);
    border-radius: 8px; padding: 14px 18px; font-size: 13.5px; }

  /* ---- composer ---- */
  .composer {
    position: fixed; bottom: 0; left: 0; right: 0; background: linear-gradient(transparent, var(--base) 24px);
    padding: 20px 22px 22px;
  }
  .composer-inner { max-width: 820px; margin: 0 auto; display: flex; gap: 10px;
    background: var(--raised); border: 1px solid var(--line); border-radius: 10px; padding: 8px 8px 8px 14px; }
  .composer-inner:focus-within { border-color: var(--accent); }
  .composer input {
    flex: 1; background: none; border: none; color: var(--text); font-size: 14.5px;
    outline: none; font-family: inherit; padding: 8px 0;
  }
  .composer button {
    background: var(--accent); color: #06122a; border: none; border-radius: 7px;
    padding: 0 18px; font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit;
  }
  .composer button:disabled { opacity: 0.4; cursor: default; }
  .composer .hint { max-width: 820px; margin: 8px auto 0; font-size: 11.5px; color: var(--faint); }
</style>
</head>
<body>

<div id="app"></div>

<script>
const API = "";  // same origin — the API serves this page
let token = null;
let me = null;
let busy = false;

const $ = (id) => document.getElementById(id);
const esc = (s) => (s ?? "").toString().replace(/[&<>"]/g, c => (
  {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// ---------- login ----------
function renderLogin(errMsg) {
  document.getElementById("app").innerHTML = `
    <div class="login-shell">
      <div class="login">
        <h1>AISOC Investigation Console</h1>
        <p>Sign in to run investigations.</p>
        <label for="key">Access key</label>
        <input type="password" id="key" placeholder="Enter your access key" autocomplete="off">
        <button class="primary" id="signin">Sign in</button>
        <div class="err">${errMsg ? esc(errMsg) : ""}</div>
        <div class="note">Development access uses a shared key. In production this
          becomes sign-in with your organization identity.</div>
      </div>
    </div>`;
  const input = $("key");
  input.focus();
  const go = () => signIn(input.value.trim());
  $("signin").onclick = go;
  input.onkeydown = (e) => { if (e.key === "Enter") go(); };
}

async function signIn(key) {
  if (!key) return;
  $("signin").disabled = true;
  try {
    const r = await fetch(`${API}/api/me`, { headers: { Authorization: "Bearer " + key }});
    if (r.status === 401) { renderLogin("That key was not accepted."); return; }
    if (!r.ok) { renderLogin("Sign-in failed (" + r.status + ")."); return; }
    token = key; me = await r.json();
    renderConsole();
  } catch (e) {
    renderLogin("Cannot reach the service. Is the server running?");
  }
}

function signOut() { token = null; me = null; renderLogin(); }

// ---------- console shell ----------
function renderConsole() {
  const u = me.user;
  const canRun = me.capabilities.includes("run_investigation");
  document.getElementById("app").innerHTML = `
    <header>
      <div class="brand"><span class="mark">AISOC</span><span class="sub">Investigation Console</span></div>
      <div class="who">
        <span class="name">${esc(u.display_name)}</span>
        <span class="role">${esc(u.roles.join(" · "))}</span>
        <button class="signout" id="signout">Sign out</button>
      </div>
    </header>
    <main><div class="wrap">
      <div class="intro">
        <h2>What would you like to investigate?</h2>
        <p>Ask about an incident, an IP, a file hash, an account, or a host.
           The console routes your question to the right specialist and returns a
           grounded verdict with its evidence.</p>
        <div class="examples">
          <button class="chip">what do we know about host knightsdc01</button>
          <button class="chip">is 13.82.149.123 malicious</button>
          <button class="chip">triage incident 7838</button>
          <button class="chip">what do we know about account steveadmin</button>
        </div>
      </div>
      <div id="stream"></div>
    </div></main>
    <div class="composer">
      <div class="composer-inner">
        <input id="ask" placeholder="${canRun ? "Ask a question…" : "Your role cannot run investigations"}"
               ${canRun ? "" : "disabled"} autocomplete="off">
        <button id="send" ${canRun ? "" : "disabled"}>Investigate</button>
      </div>
      <div class="hint">Routed to a specialist automatically · read-only · every result is grounded in cited evidence</div>
    </div>`;
  $("signout").onclick = signOut;
  document.querySelectorAll(".chip").forEach(c => c.onclick = () => { $("ask").value = c.textContent; ask(); });
  if (canRun) {
    const input = $("ask");
    input.focus();
    $("send").onclick = ask;
    input.onkeydown = (e) => { if (e.key === "Enter" && !busy) ask(); };
  }
}

// ---------- run an investigation ----------
async function ask() {
  const input = $("ask");
  const q = input.value.trim();
  if (!q || busy) return;
  busy = true; input.value = ""; $("send").disabled = true;

  const stream = $("stream");
  const turn = document.createElement("div");
  turn.className = "turn";
  turn.innerHTML = `<div class="ask">${esc(q)}</div>
    <div class="status" id="live"><span class="dot"></span> Routing to a specialist…</div>`;
  stream.appendChild(turn);
  turn.scrollIntoView({ behavior: "smooth", block: "start" });

  try {
    const r = await fetch(`${API}/api/investigate`, {
      method: "POST",
      headers: { "Content-Type": "application/json", Authorization: "Bearer " + token },
      body: JSON.stringify({ message: q }),
    });
    if (r.status === 403) { setLive(turn, `<div class="errbox">Your role cannot run investigations.</div>`, true); return; }
    if (r.status === 401) { signOut(); return; }
    if (!r.ok) { setLive(turn, `<div class="errbox">Request failed (${r.status}).</div>`, true); return; }

    // read the SSE stream
    const reader = r.body.getReader();
    const dec = new TextDecoder();
    let buf = "";
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let idx;
      while ((idx = buf.indexOf("\n\n")) >= 0) {
        const line = buf.slice(0, idx).trim(); buf = buf.slice(idx + 2);
        if (!line.startsWith("data:")) continue;
        const evt = JSON.parse(line.slice(5).trim());
        handleEvent(turn, evt);
      }
    }
  } catch (e) {
    setLive(turn, `<div class="errbox">Cannot reach the service. Is the server running?</div>`, true);
  } finally {
    busy = false;
    if ($("send")) $("send").disabled = false;
    if ($("ask")) $("ask").focus();
  }
}

function setLive(turn, html, replace) {
  const live = turn.querySelector("#live");
  if (!live) return;
  if (replace) { live.outerHTML = html; }
  else { live.innerHTML = html; }
}

function handleEvent(turn, evt) {
  const live = turn.querySelector("#live");
  if (evt.type === "start") {
    if (live) live.innerHTML = `<span class="dot"></span> Investigating…`;
  } else if (evt.type === "result") {
    renderResult(turn, evt.data);
  } else if (evt.type === "error") {
    setLive(turn, `<div class="errbox">${esc(evt.reason)}</div>`, true);
  }
}

// ---------- render a verdict ----------
const VCLASS = {
  likely_true_positive: "tp", likely_benign: "benign",
  likely_false_positive: "fp", insufficient_evidence: "insufficient",
};
const VLABEL = {
  likely_true_positive: "Likely true positive", likely_benign: "Likely benign",
  likely_false_positive: "Likely false positive", insufficient_evidence: "Insufficient evidence",
};

function renderResult(turn, data) {
  if (!data || data.status !== "ok" || !data.verdict) {
    const reason = (data && (data.reason || data.message)) || "No result.";
    const routed = data && data.routing
      ? `<div class="routing">No specialist matched — ${esc(reason)}</div>` : "";
    setLive(turn, routed + `<div class="errbox">${esc(reason)}</div>`, true);
    return;
  }
  // A report has sections/summary but no verdict disposition. Render it as a report.
  const v = data.verdict;
  if (v.sections || (v.summary && !v.verdict)) {
    renderReport(turn, data);
    return;
  }
  renderVerdict(turn, data);
}

function renderReport(turn, data) {
  const r = data.verdict;
  const routeName = data.routing ? data.routing.agent : data.agent;
  const sections = (r.sections || []).map(s =>
    `<div class="block"><h4>${esc(s.heading)}</h4><div class="reasoning" style="padding:0;border:0">${esc(s.content)}</div></div>`
  ).join("");
  const recs = (r.recommendations || []).map(x => `<li>${esc(x)}</li>`).join("");
  const html = `
    ${data.routing ? `<div class="routing">Handled by <span class="agent">${esc(routeName)}</span> · ${esc(data.routing.reason||"")}</div>` : ""}
    <div class="verdict">
      <div class="verdict-head" style="border-color:var(--accent);background:var(--accent-dim)">
        <div class="verdict-label">${esc(r.title || "Report")}</div>
        <div class="verdict-meta"><span>${esc(r.period || "")}</span></div>
      </div>
      ${r.summary ? `<div class="reasoning">${esc(r.summary)}</div>` : ""}
      ${sections}
      ${recs ? `<div class="block"><h4>Recommendations</h4><ul class="factors">${recs}</ul></div>` : ""}
      <div class="footer-meta">
        <span>Sources <b>${(data.sources_touched||[]).length}</b></span>
        <span>${(data.latency_seconds||0)}s</span>
        <span>${esc(data.model_deployment||"")}</span>
      </div>
    </div>`;
  setLive(turn, html, true);
  turn.scrollIntoView({ behavior: "smooth", block: "start" });
}

function renderVerdict(turn, data) {
  const v = data.verdict, g = data.grounding || {};
  const cls = VCLASS[v.verdict] || "";
  const routeName = data.routing ? data.routing.agent : data.agent;

  const cites = new Map((g.checks || []).map(c => [c.identifier, c.resolved]));
  const evidence = (v.key_evidence || []).map(e => {
    const ok = cites.get(e.identifier);
    const badge = ok === undefined ? "" :
      ok ? `<span class="ok">✓ resolved</span>` : `<span class="no">✕ unresolved</span>`;
    return `<div class="evi"><div class="claim">${esc(e.claim)}</div>
      <div class="cite">${esc(e.source)} · ${esc(e.identifier)} ${badge}</div></div>`;
  }).join("");

  const factors = (v.escalation_factors || []).map(f => `<li>${esc(f)}</li>`).join("");
  const missing = (v.unavailable_context || []).map(f => `<li>${esc(f)}</li>`).join("");

  const inj = (data.injection_findings || []);
  const injBlock = inj.length ? `
    <div class="injection">
      <h4>Possible manipulation detected in evidence</h4>
      <div>${inj.length} pattern(s) flagged. Treated as untrusted; an attempt to
        influence triage is itself a signal.</div>
      ${inj.slice(0,5).map(f => `<div class="item">[${esc(f.type)}] ${esc(f.location||"")}: ${esc(f.match||"")}</div>`).join("")}
    </div>` : "";

  const conf = Math.round((v.confidence || 0) * 100);
  const html = `
    ${data.routing ? `<div class="routing">Handled by <span class="agent">${esc(routeName)}</span> · ${esc(data.routing.reason||"")}</div>` : ""}
    <div class="verdict">
      <div class="verdict-head ${cls}">
        <div class="verdict-label">${esc(VLABEL[v.verdict] || v.verdict)}</div>
        <div class="verdict-meta">
          <span>Confidence <b>${conf}%</b></span>
          <span>Recommended <b class="action-pill ${esc(v.recommended_action)}">${esc(v.recommended_action)}</b></span>
        </div>
      </div>
      <div class="reasoning">${esc(v.reasoning)}</div>
      ${evidence ? `<div class="block"><h4>Evidence</h4>${evidence}</div>` : ""}
      ${factors ? `<div class="block"><h4>Escalation factors</h4><ul class="factors">${factors}</ul></div>` : ""}
      ${missing ? `<div class="block"><h4>Context not available</h4><ul class="factors missing">${missing}</ul></div>` : ""}
      ${injBlock}
      <div class="footer-meta">
        <span class="${g.flagged ? "flagged" : "grounded"}">Grounding <b>${g.citations_resolved||0}/${g.citations_total||0} citations resolved</b></span>
        <span>Sources <b>${(data.sources_touched||[]).length}</b></span>
        <span>${(data.latency_seconds||0)}s</span>
        <span>${esc(data.model_deployment||"")}</span>
      </div>
    </div>`;
  setLive(turn, html, true);
  turn.scrollIntoView({ behavior: "smooth", block: "start" });
}

// ---------- boot ----------
renderLogin();
</script>
</body>
</html>
